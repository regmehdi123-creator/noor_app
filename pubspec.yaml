name: noor
description: "A Islamic app that help you in your life"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  quran_library: 4.0.3+1
  flutter_native_splash: ^2.4.8
  get: ^4.7.3
  lottie: ^3.5.1
  flutter_islamic_icons: ^1.0.2
  country_flags: ^4.1.2
  sign_in_button: ^5.0.0
  geolocator: ^14.0.3
  flutter_compass: ^0.8.1
  permission_handler: ^13.0.1
  qibla_direction: ^1.0.1
  shared_preferences: ^2.5.1
  http: ^1.2.1
  url_launcher: ^6.3.0
  flutter_widget_from_html: ^0.17.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  just_audio: ^0.10.6
  audio_video_progress_bar: ^2.0.3
  adhan: ^2.0.0+1
  hijri: ^3.0.1
  intl: ^0.20.3
  geocoding: ^5.0.0
  flutter_local_notifications:  ^19.1.0
  timezone:  ^0.10.1
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: 6.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default:21
  notification_icon:
    image_path: "assets/images/app_icon.png"

flutter:
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/front/Cairo-Black.ttf
          weight: 900
        - asset: assets/front/Cairo-Bold.ttf
          weight: 800
        - asset: assets/front/Cairo-Light.ttf
          weight: 400
        - asset: assets/front/Cairo-Medium.ttf
          weight: 500
        - asset: assets/front/Cairo-SemiBold.ttf
          weight: 600

    - family: ScheherazadeNew
      fonts:
        - asset: assets/front/ScheherazadeNew-Medium.ttf
          weight: 600
        - asset: assets/front/ScheherazadeNew-Bold.ttf
          weight: 800
        - asset: assets/front/ScheherazadeNew-Regular.ttf
          weight: 500

  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/lottie/Ramadanlesen.json
    - assets/lottie/WalkingCat.json
    - assets/images/compass.png
    - assets/images/app_icon.png

flutter_native_splash:
  color: "#F4E5C2"
  image: assets/images/logo.png

  android: true
  ios: true
  web: false

  android_12:
    color: "#F4E5C2"
    image: assets/images/logo.png